<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GameScope{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/gamescope-logo.svg') }}" alt="" width="42" height="42">
                <span>GameScope</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('explore') }}">Explore Games</a>
            </div>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
        <p>&copy; 2026 Yousef Malik | GameScope | IT401</p>
    </footer>
</body>
</html>
